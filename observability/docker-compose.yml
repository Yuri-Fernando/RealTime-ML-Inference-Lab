version: "3.8"

# Real Prometheus + Grafana stack for the inference service. Prometheus
# scrapes the service's /metrics endpoint (service runs on the HOST, not in
# this compose file — see README.md "Como rodar"); Grafana is pre-provisioned
# with a datasource pointing at Prometheus and a dashboard JSON.
#
# Not run end-to-end in the session that built this repo (no Docker runtime
# available there) — the configuration is real and intended to be run with
# `docker compose up` against a running instance of the service on the host.
# See README.md "Status" for the honesty note.

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: rtml-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    extra_hosts:
      # host.docker.internal works natively on Docker Desktop (Windows/Mac);
      # this extra_hosts entry makes it resolve on Linux too.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: rtml-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
